name: yivu
description: "Yivu - Gamified, Adaptive Learning App for Android Tablet and Android TV."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Responsive
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database (SQLite offline-first)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking & AI Integration
  http: ^1.2.1
  flutter_dotenv: ^5.1.0

  # Sound & Celebrations for gamification
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - resources/img/branding.png
    - assets/data/curriculum.json
    - assets/data/seed_materials.json
    - assets/data/schema.sql

